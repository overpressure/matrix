# Every pull request, every push to main, and by hand: the settings are valid and every icon they name exists,
# the tool's tests pass against a fake server, the code is formatted and typed, links resolve and nothing
# private is in the history. Nothing here talks to Matrix or sees the token: that's space.yml and
# announce.yml, on main only. The last job, ci, is the one check the ruleset requires.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.4" # overpressure's
      - name: Every file valid, every icon in overpressure/brand
        run: uv run --locked python -m matrix_space --check

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.4"
      - run: uv run --locked python -m unittest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.4"
      - run: uv sync --locked
      - name: Formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run ty check

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: overpressure/overpressure
          path: .overpressure
      - name: Links in the documents
        run: python3 .overpressure/scripts/check-docs.py --repo .
      - name: Private data, in every commit
        run: python3 .overpressure/scripts/check-private.py --repo . --history

  ci:
    needs: [settings, tests, lint, repository]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          [ -z "$bad" ] || { echo "::error::not passed: $bad"; exit 1; }
